<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoja de Respuestas — Biología</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #00c27a;
    --verde-dark: #009960;
    --rojo: #ff4d6d;
    --azul: #0077ff;
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --gold: #ffd700;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── FONDO ANIMADO ─── */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 20% 20%, rgba(0,194,122,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0,119,255,0.06) 0%, transparent 50%);
    animation: bgPulse 8s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes bgPulse {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  /* ─── HEADER ─── */
  .header {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.6s ease both;
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header .escudo {
    font-size: 44px;
    margin-bottom: 8px;
    display: block;
  }
  .header h1 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--verde);
    line-height: 1.4;
  }
  .header h2 {
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--text2);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ─── SECCIONES ─── */
  .seccion {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    animation: fadeUp 0.5s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .seccion:nth-child(2) { animation-delay: 0.1s; }
  .seccion:nth-child(3) { animation-delay: 0.2s; }
  .seccion:nth-child(4) { animation-delay: 0.3s; }

  .seccion-title {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--verde);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .seccion-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ─── INPUTS ─── */
  .campo {
    margin-bottom: 14px;
  }
  .campo label {
    display: block;
    font-size: 0.72rem;
    color: var(--text2);
    margin-bottom: 6px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .campo input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .campo input:focus {
    border-color: var(--verde);
    box-shadow: 0 0 0 3px rgba(0,194,122,0.15);
  }
  .campo input::placeholder { color: var(--text2); font-size: 0.82rem; }

  /* ─── CONFIGURACIÓN RESPUESTAS CORRECTAS ─── */
  .config-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  @media (max-width: 480px) {
    .config-grid { grid-template-columns: repeat(3, 1fr); }
  }

  .config-item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }
  .config-item .num {
    font-size: 0.65rem;
    color: var(--text2);
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 6px;
  }
  .config-item select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 600;
    outline: none;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.2s;
  }
  .config-item select:focus { border-color: var(--verde); }

  /* ─── BOTÓN GUARDAR CONFIG ─── */
  .btn-config {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    background: linear-gradient(135deg, #1a3a2a, #0d2018);
    border: 1px solid var(--verde);
    border-radius: 10px;
    color: var(--verde);
    font-family: 'Sora', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-config:hover {
    background: var(--verde);
    color: #000;
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(0,194,122,0.3);
  }

  /* ─── RESPUESTAS ESTUDIANTE ─── */
  .tabla-respuestas {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .fila-pregunta {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    transition: border-color 0.2s;
  }
  .fila-pregunta.correcta { border-color: rgba(0,194,122,0.5); background: rgba(0,194,122,0.05); }
  .fila-pregunta.incorrecta { border-color: rgba(255,77,109,0.5); background: rgba(255,77,109,0.05); }

  .fila-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text2);
    min-width: 20px;
  }

  .opciones {
    display: flex;
    gap: 4px;
    flex: 1;
  }

  .opcion-btn {
    flex: 1;
    padding: 5px 2px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .opcion-btn:hover { border-color: var(--azul); color: var(--azul); }
  .opcion-btn.seleccionada {
    background: var(--azul);
    border-color: var(--azul);
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,119,255,0.35);
  }
  .fila-pregunta.correcta .opcion-btn.seleccionada {
    background: var(--verde);
    border-color: var(--verde);
    box-shadow: 0 2px 8px rgba(0,194,122,0.35);
  }
  .fila-pregunta.incorrecta .opcion-btn.seleccionada {
    background: var(--rojo);
    border-color: var(--rojo);
    box-shadow: 0 2px 8px rgba(255,77,109,0.35);
  }

  .resultado-icono {
    font-size: 0.9rem;
    min-width: 16px;
    text-align: center;
  }

  /* ─── BOTÓN CALIFICAR ─── */
  .btn-calificar {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--verde), var(--verde-dark));
    border: none;
    border-radius: 12px;
    color: #000;
    font-family: 'Sora', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 4px;
    box-shadow: 0 4px 20px rgba(0,194,122,0.25);
  }
  .btn-calificar:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,194,122,0.4);
  }
  .btn-calificar:active { transform: translateY(0); }

  /* ─── RESULTADO ─── */
  #resultado {
    display: none;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    animation: scaleIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    margin-top: 20px;
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .resultado-nombre {
    font-size: 0.75rem;
    color: var(--text2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .resultado-nombre span { color: var(--text); font-weight: 700; }

  .nota-display {
    font-size: 5rem;
    font-weight: 800;
    line-height: 1;
    margin: 16px 0 8px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: -2px;
  }
  .nota-aprobado { color: var(--verde); text-shadow: 0 0 40px rgba(0,194,122,0.5); }
  .nota-reprobado { color: var(--rojo); text-shadow: 0 0 40px rgba(255,77,109,0.4); }

  .nota-label {
    font-size: 0.75rem;
    color: var(--text2);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
  }
  .stat {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    min-width: 90px;
  }
  .stat-num {
    font-size: 1.8rem;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1;
  }
  .stat-num.correctas { color: var(--verde); }
  .stat-num.incorrectas { color: var(--rojo); }
  .stat-num.puntaje { color: var(--gold); }
  .stat-label {
    font-size: 0.65rem;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 4px;
  }

  .barra-progreso-wrap {
    background: var(--bg3);
    border-radius: 20px;
    height: 10px;
    overflow: hidden;
    margin: 16px 0;
  }
  .barra-progreso {
    height: 100%;
    border-radius: 20px;
    transition: width 1s cubic-bezier(0.34,1.2,0.64,1);
    background: linear-gradient(90deg, var(--verde), #00e5ff);
  }

  .estado-badge {
    display: inline-block;
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .badge-aprobado { background: rgba(0,194,122,0.15); color: var(--verde); border: 1px solid rgba(0,194,122,0.4); }
  .badge-reprobado { background: rgba(255,77,109,0.15); color: var(--rojo); border: 1px solid rgba(255,77,109,0.4); }

  .btn-reiniciar {
    margin-top: 20px;
    padding: 10px 28px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    font-family: 'Sora', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .btn-reiniciar:hover { border-color: var(--text2); color: var(--text); }

  /* ─── CONFIG GUARDADA BADGE ─── */
  .config-saved {
    display: none;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 8px 12px;
    background: rgba(0,194,122,0.1);
    border: 1px solid rgba(0,194,122,0.3);
    border-radius: 8px;
    font-size: 0.75rem;
    color: var(--verde);
    font-weight: 600;
  }

  /* tabs */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: none;
    border-radius: 8px;
    color: var(--text2);
    font-family: 'Sora', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.activo {
    background: var(--bg3);
    color: var(--verde);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .panel { display: none; }
  .panel.activo { display: block; }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <span class="escudo">🏫</span>
    <h1>Colegio San Juan Evangelista</h1>
    <h2>Departamento de Ciencias &nbsp;·&nbsp; Biología</h2>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab activo" onclick="cambiarTab('configurar')">⚙️ Configurar</button>
    <button class="tab" onclick="cambiarTab('responder')">📝 Responder</button>
  </div>

  <!-- ════════ PANEL CONFIGURAR ════════ -->
  <div id="panel-configurar" class="panel activo">

    <div class="seccion">
      <div class="seccion-title">Datos del examen</div>
      <div class="campo">
        <label>Curso</label>
        <input type="text" id="cfg-curso" placeholder="Ej: 1° Medio A">
      </div>
      <div class="campo">
        <label>Tema / Unidad</label>
        <input type="text" id="cfg-tema" placeholder="Ej: Célula y sus organelos">
      </div>
      <div class="campo">
        <label>Exigencia mínima (%)</label>
        <input type="number" id="cfg-exigencia" value="60" min="1" max="100">
      </div>
    </div>

    <div class="seccion">
      <div class="seccion-title">Respuestas correctas (clave)</div>
      <div class="config-grid" id="config-grid"></div>
      <button class="btn-config" onclick="guardarConfig()">✅ Guardar configuración</button>
      <div class="config-saved" id="config-saved">✔ Configuración guardada correctamente</div>
    </div>

  </div>

  <!-- ════════ PANEL RESPONDER ════════ -->
  <div id="panel-responder" class="panel">

    <div class="seccion">
      <div class="seccion-title">Datos del estudiante</div>
      <div class="campo">
        <label>Nombre completo</label>
        <input type="text" id="est-nombre" placeholder="Ingresa tu nombre">
      </div>
    </div>

    <div class="seccion">
      <div class="seccion-title">Marca tu respuesta</div>
      <div class="tabla-respuestas" id="tabla-respuestas"></div>
    </div>

    <button class="btn-calificar" onclick="calificar()">🎯 Calificar prueba</button>

    <!-- RESULTADO -->
    <div id="resultado">
      <div class="resultado-nombre">Resultado de: <span id="res-nombre">—</span></div>
      <div class="nota-display" id="res-nota">—</div>
      <div class="nota-label">Nota final (escala 1.0 – 7.0)</div>

      <div class="barra-progreso-wrap">
        <div class="barra-progreso" id="barra" style="width:0%"></div>
      </div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-num correctas" id="res-correctas">0</div>
          <div class="stat-label">✅ Correctas</div>
        </div>
        <div class="stat">
          <div class="stat-num incorrectas" id="res-incorrectas">0</div>
          <div class="stat-label">❌ Incorrectas</div>
        </div>
        <div class="stat">
          <div class="stat-num puntaje" id="res-puntaje">0%</div>
          <div class="stat-label">Puntaje</div>
        </div>
      </div>

      <div id="res-badge" class="estado-badge"></div>
      <br>
      <button class="btn-reiniciar" onclick="reiniciar()">↩ Nueva respuesta</button>
    </div>

  </div>

</div>

<script>
  const TOTAL = 30;
  let respuestasCorrectas = Array(TOTAL).fill('A');
  let respuestasEstudiante = Array(TOTAL).fill(null);
  let configGuardada = false;

  // ─── GENERAR CONFIGURADOR ───
  function generarConfigGrid() {
    const grid = document.getElementById('config-grid');
    grid.innerHTML = '';
    for (let i = 0; i < TOTAL; i++) {
      grid.innerHTML += `
        <div class="config-item">
          <div class="num">P.${i+1}</div>
          <select id="correcta-${i}">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>`;
    }
  }

  // ─── GENERAR TABLA ESTUDIANTE ───
  function generarTabla() {
    const tabla = document.getElementById('tabla-respuestas');
    tabla.innerHTML = '';
    for (let i = 0; i < TOTAL; i++) {
      tabla.innerHTML += `
        <div class="fila-pregunta" id="fila-${i}">
          <span class="fila-num">${i+1}.</span>
          <div class="opciones">
            ${['A','B','C','D'].map(op => `
              <button class="opcion-btn" id="btn-${i}-${op}" onclick="marcar(${i},'${op}')">${op}</button>
            `).join('')}
          </div>
          <span class="resultado-icono" id="icono-${i}"></span>
        </div>`;
    }
  }

  // ─── MARCAR RESPUESTA ───
  function marcar(pregunta, opcion) {
    respuestasEstudiante[pregunta] = opcion;
    ['A','B','C','D'].forEach(op => {
      document.getElementById(`btn-${pregunta}-${op}`)
        .classList.toggle('seleccionada', op === opcion);
    });
  }

  // ─── GUARDAR CONFIG ───
  function guardarConfig() {
    for (let i = 0; i < TOTAL; i++) {
      respuestasCorrectas[i] = document.getElementById(`correcta-${i}`).value;
    }
    configGuardada = true;
    const badge = document.getElementById('config-saved');
    badge.style.display = 'flex';
    setTimeout(() => badge.style.display = 'none', 3000);
  }

  // ─── CALIFICAR ───
  function calificar() {
    const nombre = document.getElementById('est-nombre').value.trim();
    if (!nombre) { alert('Por favor ingresa tu nombre.'); return; }
    if (respuestasEstudiante.includes(null)) {
      if (!confirm('Hay preguntas sin responder. ¿Continuar de todas formas?')) return;
    }

    const exigencia = parseFloat(document.getElementById('cfg-exigencia').value) / 100 || 0.6;
    let correctas = 0;

    for (let i = 0; i < TOTAL; i++) {
      const fila = document.getElementById(`fila-${i}`);
      const icono = document.getElementById(`icono-${i}`);
      fila.classList.remove('correcta', 'incorrecta');

      if (respuestasEstudiante[i] === respuestasCorrectas[i]) {
        correctas++;
        fila.classList.add('correcta');
        icono.textContent = '✅';
      } else if (respuestasEstudiante[i] !== null) {
        fila.classList.add('incorrecta');
        icono.textContent = '❌';
      }
    }

    const incorrectas = TOTAL - correctas;
    const pct = correctas / TOTAL;

    // Escala chilena con exigencia configurable
    let nota;
    if (pct >= exigencia) {
      nota = 4 + 3 * ((pct - exigencia) / (1 - exigencia));
    } else {
      nota = 1 + 3 * (pct / exigencia);
    }
    nota = Math.round(nota * 10) / 10;
    nota = Math.max(1.0, Math.min(7.0, nota));

    // Mostrar resultado
    const aprobado = nota >= 4.0;
    document.getElementById('res-nombre').textContent = nombre;
    const notaEl = document.getElementById('res-nota');
    notaEl.textContent = nota.toFixed(1);
    notaEl.className = 'nota-display ' + (aprobado ? 'nota-aprobado' : 'nota-reprobado');
    document.getElementById('res-correctas').textContent = correctas;
    document.getElementById('res-incorrectas').textContent = incorrectas;
    document.getElementById('res-puntaje').textContent = Math.round(pct*100) + '%';

    const badge = document.getElementById('res-badge');
    badge.textContent = aprobado ? '🎉 APROBADO' : '📚 REPROBADO';
    badge.className = 'estado-badge ' + (aprobado ? 'badge-aprobado' : 'badge-reprobado');

    const resultado = document.getElementById('resultado');
    resultado.style.display = 'block';
    resultado.scrollIntoView({ behavior: 'smooth', block: 'center' });

    setTimeout(() => {
      document.getElementById('barra').style.width = Math.round(pct*100) + '%';
    }, 200);
  }

  // ─── REINICIAR ───
  function reiniciar() {
    respuestasEstudiante = Array(TOTAL).fill(null);
    document.getElementById('est-nombre').value = '';
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('barra').style.width = '0%';
    generarTabla();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ─── TABS ───
  function cambiarTab(tab) {
    document.querySelectorAll('.tab').forEach((t,i) => {
      t.classList.toggle('activo', (i === 0 && tab==='configurar') || (i === 1 && tab==='responder'));
    });
    document.getElementById('panel-configurar').classList.toggle('activo', tab === 'configurar');
    document.getElementById('panel-responder').classList.toggle('activo', tab === 'responder');
  }

  // ─── INIT ───
  generarConfigGrid();
  generarTabla();
</script>
